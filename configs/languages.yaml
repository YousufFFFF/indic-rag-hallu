# Languages in scope: Stage I deck, slide 5 (CLAUDE.md §3 row 1).
# The final set is fixed by corpus availability; only enabled languages are run.
#
# Fields
#   name / native_name   English name and endonym (endonyms as on deck slide 5)
#   iso639_3             ISO 639-3 code
#   script               ISO 15924 script code
#   unicode_script       Unicode script name as used in character names (e.g. "DEVANAGARI DIGIT ZERO")
#   unicode_block        [first, last] code point of the script's Unicode block
#   digit_zero           code point of the script's DIGIT ZERO (digits 0-9 are consecutive)
#   family               language family
#   indictrans2_code     IndicTrans2 / FLORES-200 language tag
#   indicqa_file         file inside ai4bharat/IndicQA (revision pinned in docs/RESOURCES.md)
#   resource_level       resource class for Objective 05. Left null until filled from a
#                        verified, cited source (planned: Joshi et al. 2020 taxonomy) in M1.
#   enabled              included in runs (M0: Hindi only, see docs/DECISIONS.md D-007)
#
# Every Unicode field is checked against Python's unicodedata in tests/test_languages_config.py.

languages:
  hi:
    name: Hindi
    native_name: हिन्दी
    iso639_3: hin
    script: Deva
    unicode_script: DEVANAGARI
    unicode_block: [0x0900, 0x097F]
    digit_zero: 0x0966
    family: indo-aryan
    indictrans2_code: hin_Deva
    indicqa_file: data/indicqa.hi.json
    resource_level: null
    enabled: true

