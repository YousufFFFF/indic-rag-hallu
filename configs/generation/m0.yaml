# M0 generator (DECISIONS D-003, D-023). Fixed decoding: every M0 answer uses exactly this.
# NOTE: the Ollama tag `qwen3:4b` is Qwen3-4B-THINKING-2507 (always reasons, ignores
# think: false), so M0 uses the non-thinking Instruct-2507 build instead (D-023).
backend: ollama                      # native Ollama /api/chat
model: "qwen3:4b-instruct-2507-q4_K_M"
ollama_digest: 0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
hf_source: Qwen/Qwen3-4B-Instruct-2507
hf_revision: cdbee75f17c01a7cc42f958dc650907174af0554
licence: Apache-2.0
base_url_env: OLLAMA_BASE_URL        # http://host.docker.internal:11434/v1 in the dev container
prompt_template: hi                  # src/indichallu/generation/prompts/hi.txt
context_passages: 3                  # top-k retrieved passages put in the prompt
request_timeout_s: 1800              # laptop CPU: ~17.5 prompt tok/s, so a ~10k-token prompt
                                     # takes 10+ min; not part of the cache identity
decoding:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  max_new_tokens: 256
  num_ctx: 16384                     # Qwen's tokenizer spends ~1 token per Devanagari char: a real
                                     # 3-passage prompt measured 9,913 tokens, over 8192 (D-023)
  think: false                       # Instruct-2507 has no thinking mode; kept explicit
