name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfile as local development, so CI and laptops run identical environments.
      - name: Build dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: indichallu-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (ruff)
        run: docker run --rm -v "$PWD:/workspace" indichallu-dev:ci ruff check .

      - name: Format check (ruff)
        run: docker run --rm -v "$PWD:/workspace" indichallu-dev:ci ruff format --check .

      # CPU only: tests marked `slow` or `gpu` are excluded by the default pytest options.
      - name: Tests (pytest)
        run: docker run --rm -v "$PWD:/workspace" indichallu-dev:ci pytest
